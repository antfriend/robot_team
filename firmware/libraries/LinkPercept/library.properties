sentence=SP0 link-percept instrumentation for semantic positioning: per-peer RSSI histograms flushed as TTDB LINK records.
paragraph=Act II of robot_team (ttn-semantic-positioning.md Phase 0): every authenticated frame reception becomes evidence. The radio recv callback feeds per-peer RSSI into fixed histograms (no per-packet flash writes); once per window the log renders one TTDB record (@LAT97 lane) with a **LINK** line per peer (n, rssi min/med/max). Portable (no Arduino dependency) so the record format and stats are native-testable; the sketch supplies the transport hook and the Ttdb append.

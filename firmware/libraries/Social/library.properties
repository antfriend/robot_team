sentence=The default network, stage 1: who is here and what can they do - capability advertisement with a three-level status, carried on HELLO and merged with nobody being addressed.
paragraph=Everything a fleet can infer from mutual observation is relational, and a relation is invariant under moving the whole fleet - so common information yields the fleet's SHAPE and never its POSE. The four pose degrees of freedom (translation, rotation, reflection) fall only to a node holding a capability nobody else has, which makes this table a positioning instrument rather than an inventory: poseCeiling() is the fleet stating how much of its own shape it can currently know. Capabilities carry three levels - declared (the build claims it), verified (it answered at boot), exercised (it produced a percept that reached a lane) - because a self-declared capability is a claim, and UNKNOWN never collapses into ABSENT, because a node running older firmware sends no digest and is not a node without hardware. Each node bumps a cap_epoch on change and reports the epoch it holds for each peer, so a node learns from a direct experience of a beacon that somebody's picture of it is out of date, with nobody having asked. Portable (no Arduino dependency in Social.cpp); SocialNode.h is the sketch glue.

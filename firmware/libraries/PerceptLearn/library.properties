sentence=Learning from Action Rules 1 and 2: the node makes a falsifiable prediction before the world answers, then appends the outcome to a side log it never edits (@LAT92).
paragraph=Stage A (MotionPercept @LAT93) made the node write differences down; a difference is not yet learning, because nothing was ever at stake. This tier puts something at stake. A `still` motion window is a positive claim that the node was anchored, so the next link window's median RSSI to each peer should land within a small band of the one just closed - falsifiable inside 60 s against an observable LinkPercept already produces. Rule 1: the expectation is re-derived from current state every window, never a precomputed route. Rule 2: outcomes are appended (acting record, edge, expectation, observed, verdict, provenance) and nothing in the live loop mutates any record's epistemic weight - that is Stage D's job, and doing it here is the violation Rule 2 names. The band (6 dBm) is the first constant in this system with an empirical basis: it is the p90 of consecutive-window median drift across 33 link windows the node had already written while every motion window read still. Portable (no Arduino dependency); pinned by tests/test_perceptlearn.cpp.

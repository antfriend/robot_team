sentence=Lane generations: a prune writes down the boundary it creates, so citations into the pruned lane stay interpretable.
paragraph=A citation in this corpus is an ordinal (`derived_from@LAT97LON1`), so a prune resets the count and every pre-existing citation silently starts resolving to a different record with the same index — a live pointer to the wrong thing, not an honest dangle. On 2026-08-03 one CMD re-pointed 32 records on the Cardputer. This library makes the boundary a record in its own lane (@LAT100, `**LANE-PRUNED** lane: gen: removed: last_lon:`), the same move @LAT90's REMAP makes for a superseded timeline. The invariant is no prune without a marker: capacity is checked before the rewrite, and a boundary that cannot be written stops the prune. Portable half is native-testable; LaneGenNode.h is the Arduino glue (one copy, six sketches).

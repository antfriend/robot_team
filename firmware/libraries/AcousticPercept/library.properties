sentence=SP0 acoustic tier for semantic positioning: microphone windows logged as TTDB ACOUSTIC records (@LAT94), including the fleet-clock timestamp of the loudest transient.
paragraph=The first non-radio percept tier of robot_team Act II (ttn-semantic-positioning.md Phase 3 groundwork). Every earlier tier measures electromagnetic amplitude, and the 2026-07-10 garden run found amplitude to be shadowing-limited outdoors. Sound travels at 343 m/s - slow enough that a fleet synchronized to ~10 ms can measure a time DIFFERENCE of arrival instead, with an error bounded by clock quality rather than by foliage. This log folds PCM blocks into per-window ambient level plus the count and synced-clock timestamp of impulsive transients; two nodes logging the same clap have measured something about their separation. Consolidation stays on the companion. Portable (no Arduino dependency).

sentence=BLE near-range proximity tier for semantic positioning (SP0): advertise a fleet id + scan peers, feeding RSSI into LinkPercept.
paragraph=Act II of robot_team (ttn-semantic-positioning.md Phase 0), the near-range tier alongside ESP-NOW. Wraps the ESP32 core BLE library: it advertises this node's key-tagged fleet advert (toot::buildBleAdvert) as manufacturer data and passively scans for peers, decoding each fleet advert (toot::parseBleAdvert) and reporting (peer_id, RSSI) to a callback that feeds LinkPercept's PROTO_BLE histograms. ESP32-only glue; the advert codec it uses is portable + native-tested in the Toot library. Coexists with WiFi/ESP-NOW via the radio arbiter.

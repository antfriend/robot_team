sentence=The EPS arbiter: per-modality (sal, conf) ranked by EPS = sal x (255 - conf) / 255, with decay, dwell and a take-over margin.
paragraph=Phase S1 of docs/design/cardputer-sensorium.md, headless. Reuses TTDB-RFC-0005's attention currency rather than inventing a salience scheme; conf is how well-explained a stimulus is, so our own tone, a key press or a routine HELLO can never win the screen. Also carries the neighbour-novelty and motion-salience sources. Portable (no Arduino dependency).

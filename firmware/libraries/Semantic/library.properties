sentence=TTG-RFC-0002/0003 for a bounded store: percept lines, a streaming deterministic consolidator, and fold-before-forget so a write is never refused.
paragraph=Act III's memory tier. TTG-RFC-0003 §2 says beliefs are DERIVED by counting - per episode take the largest weight of its + percepts and of its - percepts, sum those over episodes, and read polarity and conf off the two sums - which makes consolidation ORDER-INDEPENDENT, the one property PerceptLearn's asymmetric +2/-16 fold structurally cannot have. Counting is implemented here as a STREAM rather than a pass over a loaded lane, because A32-RFC-0002 forbids loading the TTDB whole, and because streaming makes fold-before-forget a MOVE instead of a recompute: an evicted episode's per-episode contribution is subtracted from the live tally and added to the carried tally, so the total is invariant across eviction by construction rather than by argument. The carried tally is written as its own `carried:` line, never as a `belief:` line, because @LAT92's boundary rule already paid for that lesson - a gravestone that matches the consolidator's own needle gets folded as testimony next time the lane is read and the node re-learns from its own headstone forever. Arithmetic is integer halves (weight_partial 0.5 = one half), never float, so a belief line is byte-identical on every platform that builds it. The triple table is bounded and reclaims LOWEST EPS when full - the same value function the arbiter and the snake read - so it degrades by forgetting what it neither relies on nor doubts, and never by refusing a write. Portable: no Arduino dependency, so tests/test_semantic.cpp pins it natively.

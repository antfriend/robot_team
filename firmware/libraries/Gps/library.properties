sentence=Portable NMEA GGA parser for the fleet's roaming GPS anchor (semantic positioning SP2).
paragraph=Act II of robot_team (ttn-semantic-positioning.md Phase 2): the T-Deck Plus GPS is the roaming ground-truth anchor/verifier. This library turns a stream of NMEA bytes into a decoded fix (lat/lon in 1e-7 deg, MSL altitude, quality, sats, HDOP) with no Arduino, no dynamic allocation, and NMEA-checksum validation — so the fix decode is native-testable and the sketch only supplies the UART. GGA is parsed (position + quality in one sentence); other sentences are ignored.

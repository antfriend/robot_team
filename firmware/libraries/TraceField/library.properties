sentence=A stigmergic trace field on the pulse's 16-step grid: deposits decay on read, peers merge by max over HELLO, and the field is voiced as the score it became.
paragraph=The first FIELD in the sense of TTDB-RFC-0010 - a medium agents deposit into, that decays on its own, that nobody addresses - built RAM-only and deliberately NOT as a TTDB lane, so it cites nothing and passes RFC-0010 section 6.3's test (the system stays correct with the field empty) trivially. A deposit lands at the pulse step where it happened, so the field records the rhythm of what a node sensed on the grid the whole fleet already shares, then replays it until it fades. The merge is max-of-decayed, which makes it idempotent, order-free and clock-free: the digest carries already-decayed values, so a receiver needs no part of the sender's time base - which matters because a stream clock is a ratchet, right for recency and wrong for a duration. Portable (no Arduino dependency in TraceField.cpp); TraceFieldNode.h is the sketch glue.

sentence=Minimal ES8311 audio-codec bring-up (I2C control, I2S slave, MCLK from BCLK) for the M5Stack Cardputer ADV speaker and microphone.
paragraph=The Cardputer ADV puts an ES8311 codec between the ESP32-S3 and both its speaker (via an NS4150B amp) and its MEMS microphone, so neither works until these registers are written. Distilled from the Espressif ES8311 driver (MIT) down to the one configuration this board uses - codec as I2S slave, 16-bit standard format, internal MCLK taken from the SCLK pin because the board routes no MCLK. Arduino-dependent (Wire) by nature: register I/O, not portable reasoning code.

sentence=SP0 entity-co-occurrence instrumentation for semantic positioning: duty-cycled WiFi scans logged as TTDB ENTITY records.
paragraph=Act II of robot_team (ttn-semantic-positioning.md Phase 0, entity tier). The sibling of LinkPercept: a duty-cycled WiFi scan feeds each visible BSSID here; per window the log renders one TTDB record (@LAT96 lane) with an **ENTITY** line per AP (id, sightings, strongest rssi). Two nodes seeing the same APs are probably near each other — companion.py consolidates the Jaccard overlap into a coarse proximity bound. Portable (no Arduino dependency) so the record format and stats are native-testable; the sketch supplies the scan hook and the Ttdb append.

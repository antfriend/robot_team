sentence=SP0 motion tier for semantic positioning: accelerometer windows logged as TTDB MOTION records (@LAT95) so a percept window can say whether the node held still.
paragraph=The third percept tier of robot_team Act II (ttn-semantic-positioning.md Phase 0), and the first about the observer rather than the observed. LinkPercept and EntityPercept both assume the node did not move while a window accumulated; the 2026-07-07 walking range test showed that assumption failing (a carried node fuses several places into one distance). This log folds accelerometer samples into a per-window verdict - still or moving, with the fraction of time in motion - so the consolidator can weigh each window by whether its observer was anchored. Portable (no Arduino dependency); the sketch supplies the IMU read and the Ttdb append.

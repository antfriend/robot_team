sentence=The team time stream: a fleet-owned timeline that survives the laptop's absence.
paragraph=Splits the single `synced` bit — which conflated "we agree with each other" with "we know what day it is" — into `stream:<id>` (which shared timeline a record belongs to) and `wall:<0|1>` (is that timeline anchored to a real-world date). A stream's clock reads elapsed-since-its-own-origin, which makes the merge rule (older stream wins, because it preserves more history) identical to "the larger clock wins" and makes monotonicity automatic: yielding to an older stream always moves the clock forward. Anchors ride on the existing HELLO beacon; timeline changes are logged as @LAT90 records carrying the offset mapping, so records written under an abandoned stream stay interpretable. Portable (no Arduino dependency) so the merge rule is native-testable.
